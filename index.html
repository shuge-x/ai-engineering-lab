:root{--bg:#f5f7fb;--panel:#fff;--text:#18263d;--muted:#66758c;--line:#dce4ef;--blue:#2457c5;--soft:#edf3ff;--teal:#147e7d;--amber:#a56b16;--red:#b54747} [data-theme=dark]{--bg:#111827;--panel:#1b273b;--text:#e8eef8;--muted:#a2afc3;--line:#35445b;--blue:#8eb3ff;--soft:#243755;--teal:#70d3ce;--amber:#e5bb70;--red:#ff9b9b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.top{height:68px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:3}.brand{display:flex;align-items:center;gap:11px;font-weight:800}.logo{background:var(--blue);color:white;border-radius:9px;padding:7px 9px}.muted,small{color:var(--muted)}.actions{display:flex;gap:10px;align-items:center}input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 11px;color:var(--text);width:min(300px,36vw)}button{font:inherit;cursor:pointer}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);max-width:1500px;margin:auto;min-height:calc(100vh - 110px)}aside{background:var(--panel);border-right:1px solid var(--line);padding:22px 13px}.label{font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:800;padding:10px}.nav{display:block;width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:9px 10px;border-radius:8px;font-size:13px}.nav:hover,.nav.active{background:var(--soft);color:var(--blue);font-weight:700}main{padding:28px clamp(16px,3vw,42px);min-width:0}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center;padding:25px 0}.eyebrow{font-size:10px;letter-spacing:.15em;color:var(--blue);font-weight:800}.hero h1{font-size:clamp(30px,4vw,48px);line-height:1.15;margin:10px 0}.hero p,.lead{color:var(--muted);max-width:760px}.diagram,.card,.panel,.story{background:var(--panel);border:1px solid var(--line);border-radius:13px}.diagram{padding:20px;display:grid;grid-template-columns:1fr 24px 1fr;gap:8px;align-items:center;min-height:170px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}.node{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px;text-align:center}.node b{display:block}.node small{font-size:10px}.arrow{text-align:center;color:var(--blue)}.chips{grid-column:1/-1;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.chip,.tag{font-size:10px;padding:4px 8px;border-radius:30px;background:var(--soft);color:var(--blue);font-weight:700}.tag.teal{background:#e8f6f4;color:var(--teal)}.tag.amber{background:#fff3dc;color:var(--amber)}.section{display:flex;justify-content:space-between;align-items:end;margin:26px 0 12px}.section h2{margin:0;font-size:20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{padding:16px;text-align:left;color:var(--text);transition:.15s}.card:hover{border-color:var(--blue);transform:translateY(-2px)}.card h3{margin:10px 0 5px}.card p{margin:0;color:var(--muted);font-size:12px}.story{padding:14px;margin:14px 0}.story b{font-size:13px}.story p{color:var(--muted);font-size:12px;margin:4px 0}.lab{display:grid;grid-template-columns:190px minmax(300px,1.4fr) minmax(220px,.8fr);gap:12px;align-items:start}.panel{overflow:hidden}.ph{padding:11px 13px;border-bottom:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:800;display:flex;justify-content:space-between}.pb{padding:13px}.step{display:block;width:100%;border:0;background:transparent;color:var(--muted);padding:9px;text-align:left;border-radius:8px;font-size:11px}.step.active{background:var(--soft);color:var(--blue);font-weight:800}.switch{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:8px;margin-bottom:10px}.switch button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:6px;padding:6px;font-size:11px}.switch button.active{background:var(--panel);color:var(--text);font-weight:800}.detail{padding:16px}.detail h2{font-size:21px;margin:6px 0}.detail p{font-size:13px;color:var(--muted)}.handoff{padding:10px;border-left:3px solid var(--teal);background:rgba(20,126,125,.08);font-size:11px;margin:14px 0}.cmd{position:relative;background:#111c2e;color:#e9f0ff;padding:12px;border-radius:8px;font:11px/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.cmd button{position:absolute;right:7px;top:7px;background:#263852;color:white;border:1px solid #60708a;border-radius:5px;font-size:10px;padding:3px 7px}.controls{display:flex;justify-content:space-between;margin-top:12px}.controls button,.action{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 11px;font-size:11px}.controls .primary{background:var(--blue);color:white;border-color:var(--blue)}.article{display:grid;grid-template-columns:1.3fr .7fr;gap:13px}.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px;margin-bottom:12px}.box h2{font-size:16px;margin:0 0 8px}.box h3{font-size:13px;margin:16px 0 5px}.box p,.box li{font-size:12px;color:var(--muted)}.box ul,.box ol{padding-left:19px}.table{width:100%;border-collapse:collapse;font-size:11px}.table td,.table th{padding:8px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted)}.foot{border-top:1px solid var(--line);padding:13px 24px;color:var(--muted);font-size:11px;background:var(--panel);display:flex;justify-content:space-between}
@media(max-width:1050px){.lab{grid-template-columns:175px 1fr}.lab .right{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.top{padding:8px 12px;height:auto;min-height:60px}.brand small{display:none}.layout{display:block}aside{display:flex;gap:4px;overflow:auto;padding:7px;border-right:0;border-bottom:1px solid var(--line)}aside .label{display:none}.nav{white-space:nowrap;width:auto;font-size:11px;padding:7px}main{padding:17px 12px}.hero{grid-template-columns:1fr}.grid,.lab,.article{grid-template-columns:1fr}.lab .right{grid-column:auto}.step-list{display:grid;grid-template-columns:1fr 1fr}.foot{display:block}.foot span{display:block}.hero h1{font-size:32px}}

<script>
const W=[
{id:"quick",n:"01",title:"快速修改",level:"L0 · 轻量执行",summary:"需求明确、影响范围小，直接实施并做针对性验证。",story:"修改 Workspace 页面空状态",bg:"用户希望补充空状态说明、调整按钮层级和留白，不改变业务规则、接口或数据结构。",skills:"implement · tdd（按需）· code-review（按需）",when:"文案、样式、局部逻辑、明确的小 Bug。",out:"代码 Diff、针对性测试或浏览器验证、交付说明。",gate:"发现需求歧义、影响范围扩大或风险升高时，停止并升级流程。",steps:[["读取上下文","Agent","读取 AGENTS.md 和模块说明，用 CodeGraph 定位空状态组件、样式入口及调用者。只探索本次修改涉及区域。","组件位置、现状和修改范围","请阅读项目规范，并用 CodeGraph 定位 Workspace 空状态组件。先说明修改范围，不要扩大需求。"],["确认验收结果","人 + Agent","把目标转成可观察结果：文案清楚、主按钮突出、窄屏不溢出、非空列表行为不变。无需正式 Spec。","简短验收清单","验收条件：空状态文案清楚、主按钮层级明确、窄屏布局正常，非空列表行为不变。按此直接修改。"],["实施与验证","Agent","按 implement 完成最小修改。逻辑变化做针对性测试；纯视觉变化检查真实浏览器视口，不强行编写无意义单测。","代码变更、测试或浏览器证据","请实施最小改动。运行相关测试；UI 变化提供桌面和窄屏浏览器验证证据。"],["检查并交付","Agent","检查 Diff、意外文件变更和验证结果。报告实际执行过的命令，不把未执行的检查写成通过。","Diff 摘要、验证证据、未覆盖事项","检查 Diff 和验证证据，说明改动范围、测试结果及未覆盖风险。不要自动提交或发布。"]],fault:[["错误：把小修改升级成完整 SDD","仅调整空状态提示，却自动启动 Grill、ADR、Spec、Tickets 和多 Agent，造成流程成本。","修正：明确、低风险、单会话任务直接 implement。","这是明确的小修改，不创建正式 Spec、Tickets 或 ADR，只做必要分析、修改和验证。"],["错误：只看单元测试","组件测试通过，但窄屏真实页面按钮换行、文本遮挡。","修正：UI 变化用真实浏览器 / 视口检查。","测试通过不代表 UI 验收完成。请检查桌面和窄屏真实页面并提供证据。"]]},
{id:"discovery",n:"02",title:"需求探索与设计",level:"设计阶段",summary:"目标明确但真实需求、业务规则或方案尚未确定。",story:"Workspace 多用户共享功能",bg:"用户提出团队成员共享 Workspace，但共享对象、角色权限、数据归属和移除成员后的历史处理均未明确。",skills:"grill-with-docs · domain-modeling · ADR（按需）",when:"需求只有方向；业务术语、角色、状态或边界不清；多个方案需要权衡。",out:"GLOSSARY 更新、必要 ADR、设计摘要、未决问题。",gate:"需求探索只负责理解和设计。设计认可不等于编码授权。",steps:[["恢复已有业务上下文","Agent","读取 Workspace 模块知识、GLOSSARY、ADR 和现有实现；用 CodeGraph 探索成员、权限、Runtime 关系。区分事实与未知。","现状摘要、待澄清问题","先读取 Workspace 文档并用 CodeGraph 探索成员、权限和 Runtime 关系，区分已存在事实与未知需求。"],["Grill：澄清共享含义","人 + Agent","围绕共享对象、角色、访问范围、配置权限、移除成员后的数据归属逐项提问。一次聚焦一个关键问题。","已确认需求、非目标、业务规则","使用 grill-with-docs 访谈我，一次只问一个关键问题，优先挑战共享范围、成员权限和数据归属。不要编码。"],["领域建模","Agent（用户确认）","建立 Workspace、Membership、Role、Invitation 等概念，明确身份关系、状态转换和不变量。","术语、领域关系、状态约束","基于已确认回答做 domain-modeling，标注已确认、假设和待决策事项。"],["记录重要决策","人 + Agent","有实质性取舍时形成 ADR；没有真实权衡的普通实现细节不必写 ADR。","必要 ADR、方案与后果","将已经确认且有架构权衡的决策记录为 ADR，包含上下文、候选方案、决定、理由和后果。"],["设计确认并停止","人","汇总目标、范围、规则、边界、风险和未决事项。用户确认后停止，等待下一步授权。","设计摘要、决策清单","输出设计确认报告。当前授权仅限需求与设计，不得调用 implement 或修改业务代码。"]],fault:[["错误：把模糊词当成确定需求","用户说“共享 Workspace”，Agent 自行假设所有成员拥有相同权限并开始设计数据库。","修正：影响权限、隔离或生命周期的歧义必须追问。","不要自行定义共享含义。请逐项澄清访问范围、角色、资源和移除规则。"],["错误：设计确认后擅自编码","用户认可设计，Agent 将认可理解为实施授权，跳过 Spec 直接改代码。","修正：设计阶段结束后明确停止并报告下一步。","设计已确认，但我尚未授权编码。停止修改代码，输出下一步建议。"]]},
{id:"feature",n:"03",title:"常规功能开发",level:"L2 · 规格驱动",summary:"功能跨多个层次或需要跨会话保留；先规格化，再拆解可验证任务。",story:"Workspace 邀请成员功能",bg:"Owner 可以通过邮箱邀请成员，邀请链接有有效期，成员接受后加入 Workspace，涉及数据库、API、邮件和 UI。",skills:"grill（有歧义时）· to-spec · to-tickets · implement · tdd · code-review",when:"涉及前后端或数据库；需要跨会话；需要正式验收。",out:"Feature Spec、Tickets / 依赖图、代码与测试、审查报告、知识更新。",gate:"编码前必须有实施授权和可追踪 Spec / Ticket。实质需求变化需重新确认。",steps:[["确认需求基线","Agent","读取模块知识、GLOSSARY、ADR 和相关代码。关键规则未定则返回 Grill，不在 Spec 中偷偷补全。","需求来源、约束和批准设计","读取 Workspace 知识和代码，确认邀请规则、权限和有效期已明确；若有关键歧义先暂停。"],["生成 Feature Spec","用户调用 /to-spec","记录问题、目标、用户故事、规则、边界、非目标、实现和测试决策。保留原始回答的默认值、禁止事项和失败场景。","Feature Spec、验收条件","/to-spec：逐项对照已确认回答，保留约束、默认值、负面要求、边界和异常场景。"],["拆分 Tickets","用户调用 /to-tickets","拆成可独立实现和验证的纵向切片，声明依赖和每项验收条件。","Ticket 列表、阻塞关系","/to-tickets：按可独立验证的纵向切片拆分，声明依赖、验收条件和测试。"],["实施单项任务","用户调用 /implement","实施前读取 Spec、Ticket 和相关 CodeGraph 调用链。按 TDD 建立失败测试，再实现最小改动。","代码、测试、任务状态","/implement：先读取关联 Spec 和当前 Ticket，再用 CodeGraph 定位实现，按 TDD 实施。"],["独立审查","Agent 按需调用","分别检查工程标准与 Spec Compliance，逐条关联需求、实现位置和测试证据。","Standards Review、Spec Review","独立审查 Standards 和 Spec Compliance，列出需求、实现位置、测试证据和未覆盖项。"],["验收与知识对账","人 + Agent","自动化测试和规格审查通过后按风险执行 E2E 与人工验收；验收后更新模块知识、GLOSSARY 和 ADR。","验收记录、模块知识更新","执行 Knowledge Reconciliation，对照批准 Spec、实际 Diff、测试和人工反馈更新受影响知识。"]],fault:[["错误：Spec 弱化原始约束","访谈确认邀请过期后不可复用，但 Spec 只写“邀请具有有效期”。","修正：回看原始访谈，核对默认值、否定条件和异常分支。","请将 Spec 与原始 Grill 回答逐条比对，列出遗漏或被弱化的约束。"],["错误：Ticket 只按技术层拆分","数据库、API、UI 分开建任务，没有任何任务能独立证明用户成功接受邀请。","修正：按可观察用户行为纵向切片。","重新审查 Ticket 粒度，形成可独立演示的纵向切片并声明依赖。"]]},
{id:"architecture",n:"04",title:"大型架构与跨会话",level:"L3 · 先解决未知",summary:"跨模块、高风险或架构方向未收敛；先决策地图，再规格化、拆解和执行。",story:"Workspace Runtime 迁移机制",bg:"迁移涉及容器、文件、Session、运行状态、凭据和数据兼容性，直接拆任务会掩盖未知决策。",skills:"wayfinder · research / prototype · to-spec · to-tickets · implement-spec · tdd · code-review",when:"架构未知、跨服务边界、数据迁移、兼容性或容灾问题。",out:"Decision Map、ADR、架构 Spec、任务依赖图、实施与迁移验证证据。",gate:"架构方向、迁移策略、兼容性和不可逆操作必须由人确认。",steps:[["建立现状地图","Agent","读取架构文档与 ADR；用 CodeGraph 从 Workspace 追踪 Runtime Adapter、容器、文件和 Session。","现状调用图、模块依赖","用 CodeGraph 探索 Workspace 到 Runtime、Container、Session、Artifact 的调用链，并核对关键源码。"],["Wayfinder 决策地图","Agent + 用户","列出停机策略、Session 处理、文件复制、配置兼容、失败回滚、权限审计等未知决策。","Decision Map、决策依赖","/wayfinder：建立 Runtime 迁移决策地图，区分事实、假设、待验证问题和必须由我决定的规则。"],["研究与原型","Agent（授权范围内）","对高风险技术点做最小实验，记录环境、版本、证据和限制。","实验记录、方案比较","对高风险未知点做最小原型验证，先说明范围，不触碰生产数据或环境。"],["形成 ADR 与 Spec","人 + Agent","用户确认关键决策后记录 ADR，再通过 to-spec 固化成功、失败、回滚和兼容场景。","ADR、架构 Spec、验收矩阵","将确认决策写入 ADR，并用 /to-spec 形成迁移规格。"],["任务图与执行策略","Agent + 用户","to-tickets 建立依赖；仅当任务边界稳定、接口明确、文件冲突可控时才多 Agent。","Ticket 依赖图、接口契约","/to-tickets：标注依赖、共享文件、接口契约和风险，评估是否值得并行。"],["实施与集成验证","Agent / Subagents","逐项 TDD 和 Review；集成后验证完整迁移、幂等性、失败恢复、数据完整性和回滚。","代码、Migration、集成测试","/implement-spec：按依赖执行，提供逐项测试证据，验证完整链路和失败恢复。"],["最终验收与知识更新","人 + Agent","独立架构审查、E2E、迁移演练和人工验收；更新所有受影响模块知识。","最终审查、迁移验收、知识更新","对照批准 ADR 和 Spec 做最终验收，更新模块知识并标明未验证生产事项。"]],fault:[["错误：未知问题被伪装成任务","未研究 Session 是否跨 Runtime 兼容，就先拆出迁移 API，开发中途推翻方案。","修正：先用 Wayfinder 解决影响架构的未知决策。","暂停任务拆解，先列出会改变架构的未知决策并逐项研究。"],["错误：为了并行而并行","多个 Agent 同时修改共享 Service 和接口，产生冲突和不一致。","修正：根据依赖、文件所有权和合并成本决定并行。","评估 Ticket 文件所有权、接口依赖和合并成本；无法隔离就串行。"]]},
{id:"bug",n:"05",title:"复杂 Bug 诊断",level:"风险驱动",summary:"真实使用出现异常时先复现症状，再定位根因；禁止先猜原因直接改代码。",story:"容器已启动但 Workspace 仍显示失败",bg:"自动化测试通过，真实环境中容器和 Runtime 已响应，但 Workspace 状态停留 Starting，刷新后偶尔变 Failed。",skills:"diagnosing-bugs · CodeGraph · tdd · code-review",when:"测试通过但用户仍遇到问题；间歇性、跨服务或状态不一致。",out:"故障复现、根因证据、回归测试、修复 Diff、验证报告。",gate:"无证据不得修改；业务状态语义变化需用户确认。",steps:[["收集真实症状","人 + Agent","记录操作、时间、Workspace、Runtime、容器状态、页面、日志和版本。区分事实与推测。","复现步骤、环境版本、日志","使用 diagnosing-bugs，整理真实症状、复现步骤和日志，暂不修改代码。"],["建立复现循环","Agent","构建能稳定捕获状态不一致的测试或脚本：集成测试、HTTP、Playwright 或事件重放。","失败测试 / 复现脚本","先建立能稳定复现症状的最小测试，证明当前代码上失败并记录输出。"],["追踪状态链路","Agent","用 CodeGraph 从容器创建、健康检查、事件写入、状态聚合到前端读取追踪链路。","调用链、状态写入点","用 codegraph_explore 追踪容器创建到 Workspace 状态更新链路，重点看事件、持久化和前端读取。"],["验证根因假设","Agent + 用户","逐个提出可证伪假设，例如旧事件覆盖新状态、事务提交顺序或轮询缓存问题。","假设、支持 / 反证、根因","每次只验证一个根因假设，列出支持证据、反证和下一项实验。"],["TDD 修复","Agent","将原始故障变成回归测试，先确认失败，再做最小修复；不要 Mock 掉关键异步边界。","回归测试、代码修复","先将真实故障写成回归测试，确认失败后再做最小修复。"],["验证原始场景","人 + Agent","重跑原始复现步骤，检查页面、状态和 Runtime；再运行相关测试与 Review。","原始故障复测、验收状态","重新执行原始故障步骤，检查真实页面和状态；区分自动化通过与人工验收。"]],fault:[["错误：直接猜测并修改","看到 Starting 超时就把超时从 30 秒改成 120 秒，掩盖事件丢失根因。","修正：先复现、定位状态链路，再验证假设。","撤销未经证实的超时调整，先构建复现并追踪状态事件。"],["错误：只验证新测试","新增单元测试通过，但真实容器流程仍然异常。","修正：必须重新执行最初用户复现步骤。","不要只报告新单元测试，请重跑原始用户场景并提供证据。"]]},
{id:"refactor",n:"06",title:"架构优化与重构",level:"L1–L3 · 按风险",summary:"先理解现有依赖和行为，再定义重构目标；以行为保持和可回滚为核心。",story:"WorkspaceService 职责过载",bg:"WorkspaceService 同时处理成员、Runtime 绑定、容器生命周期、会话初始化和 Artifact 权限，修改一个功能经常牵连其他功能。",skills:"CodeGraph · improve-codebase-architecture · codebase-design · implement · tdd · code-review · retro",when:"职责膨胀、重复逻辑、循环依赖、难测试；有证据证明结构增加修改成本。",out:"架构问题清单、必要 ADR、行为保持测试、小步 Diff、Retro。",gate:"重构先定义行为保持标准；业务行为变化需升级为功能设计。",steps:[["建立结构基线","Agent","CodeGraph 查询 callers、callees、依赖模块和影响范围，识别职责聚集与循环依赖。","调用图、依赖热点","用 CodeGraph 分析 WorkspaceService 调用者、被调用者、依赖模块和影响范围。"],["定义重构目标","Agent + 用户","明确拆分职责但保持 API、数据语义和用户可见行为；不做无边界重写。","目标、非目标、行为不变量","提出最小重构边界，明确行为必须保持、结构允许改变和本次非目标。"],["建立行为保护","Agent","补齐 API 契约、权限、Runtime 绑定和容器状态测试，建立可信基线。","行为保持测试、基线结果","重构前建立行为保护测试，覆盖公共接口、权限和跨服务状态。"],["小步重构","Agent","每次只调整一个职责或依赖方向，持续运行相关测试。","小步 Diff、测试结果","按小步重构，每次只处理一个职责边界，修改后运行相关测试并检查 Diff。"],["影响与质量审查","Agent","用 CodeGraph 检查变更后的调用关系；审查耦合是否真的下降，而不是转移到新模块。","前后结构对比、测试、Review","复查重构后的调用图、依赖方向和测试，检查是否只是转移耦合。"],["复盘与沉淀","人 + Agent","用 retro 区分一次性问题和系统性问题，只把可复用改进写入规范。","Retro、规范更新、模块知识","执行 retro，识别重复性问题并更新模块知识；避免 AGENTS.md 无限制膨胀。"]],fault:[["错误：重构变成重写","一次性重写 Service、API、数据库模型和权限系统，无法定位回归。","修正：缩小边界，先建立行为保护测试，再小步重构。","停止扩大重写，恢复行为基线，拆成可独立验证的小步。"],["错误：图谱没有调用就删除","CodeGraph 未显示调用者，Agent 删除了反射或配置触发的函数。","修正：图谱不是运行时全知，检查动态调用、配置和外部入口。","删除前检查反射、配置入口、事件订阅和外部 API。"]]}
];

["grill-with-docs","用户主动调用","需求访谈并沉淀领域知识","需求、业务规则或边界不清楚时。"],
["domain-modeling","按需专业能力","识别领域概念、关系、状态和不变量","出现新业务实体、复杂状态或概念冲突时。"],
["to-spec","用户主动调用","把已确认需求整理为变更规格快照","需要跨会话、跨模块或正式验收时。"],

const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let page="home",wid="feature",branch="main",step=0,search="";
const done=JSON.parse(localStorage.getItem("ael-progress")||"{}");
function nav(){ $("#nav-workflows").innerHTML=W.map(w=>'<button class="nav '+(page==="workflow"&&wid===w.id?"active":"")+'" data-w="'+w.id+'">'+w.n+' · '+w.title+'</button>').join("");document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));}
function go(p,id){page=p;if(id)wid=id;branch="main";step=0;render();window.scrollTo(0,0)}
function home(){return '<section class="hero"><div><div class="eyebrow">PERSONAL AI SOFTWARE ENGINEERING PRACTICE</div><h1>把 AI 编程，变成<br><span style="color:var(--blue)">可理解、可验证的工程实践。</span></h1><p>以 Matt Pocock Skills 为主工作流，以 CodeGraph 补充代码结构知识。通过六种真实开发故事，学习何时澄清需求、何时写规格、如何实施、验证与沉淀知识。</p><p><span class="tag">中文实践</span> <span class="tag teal">Matt Skills</span> <span class="tag">CodeGraph</span></p></div><div class="diagram"><div class="node"><b>Human</b><small>目标 · 决策 · 授权</small></div><div class="arrow">→</div><div class="node"><b>Agent</b><small>分析 · 规划 · 执行</small></div><div class="chips"><span class="chip">Skills</span><span class="chip">CodeGraph</span><span class="chip">Repository</span><span class="chip">Evidence</span></div></div></section><div class="section"><div><h2>你现在要做什么？</h2><small>从实际开发任务出发，选择适合的工程工作流。</small></div><small>六种实践路径</small></div><div class="grid">'+W.map(w=>'<button class="card" data-w="'+w.id+'"><span class="tag">'+w.n+' · '+w.level+'</span><h3>'+w.title+'</h3><p>'+w.summary+'</p><p style="color:var(--blue);margin-top:14px">开发故事：'+w.story+' →</p></button>').join("")+'</div><div class="section"><h2>两个必须解决的工程问题</h2></div><div class="grid" style="grid-template-columns:repeat(2,1fr)"><button class="card" data-page="knowledge"><h3>◇ 新会话如何快速理解项目？</h3><p>Matt 保存业务意图和决策，CodeGraph 提供当前代码结构、调用链与影响范围。</p></button><button class="card" data-page="verify"><h3>✓ 为什么测试通过，实际使用仍有问题？</h3><p>区分测试通过、规格符合、端到端验证和真实用户验收。</p></button></div><div class="section"><h2>工程原则</h2></div><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="card"><b>人掌握决策权</b><p>目标、业务规则、重要架构和最终验收由人决定。</p></div><div class="card"><b>Agent 负责执行</b><p>在明确授权范围内组织 Skills、测试与审查。</p></div><div class="card"><b>证据决定完成</b><p>实际测试、Diff 和验收记录比“我完成了”更重要。</p></div></div>'}
function workflow(){let w=W.find(x=>x.id===wid),steps=w[branch],s=steps[Math.min(step,steps.length-1)];return '<div class="eyebrow">WORKFLOW '+w.n+'</div><h1>'+w.title+'</h1><p class="lead">'+w.summary+'</p><div class="story"><b>完整开发故事：'+w.story+'</b><p>'+w.bg+'</p></div><p><span class="tag">'+w.level+'</span> <span class="tag teal">'+w.skills+'</span></p><div class="lab"><section class="panel"><div class="ph">阶段导航 <span>'+ (step+1)+' / '+steps.length+'</span></div><div class="pb"><div class="switch"><button data-branch="main" class="'+(branch==="main"?"active":"")+'">正确主流程</button><button data-branch="fault" class="'+(branch==="fault"?"active":"")+'">常见错误</button></div><div class="step-list">'+steps.map((x,i)=>'<button class="step '+(i===step?"active":"")+'" data-step="'+i+'">'+(i+1)+'. '+x[0]+'</button>').join("")+'</div><h4>适用条件</h4><p class="muted" style="font-size:11px">'+w.when+'</p></div></section><section class="panel"><div class="ph">阶段演示 <span>'+s[1]+'</span></div><div class="detail"><small>阶段 '+(step+1)+'</small><h2>'+s[0]+'</h2><p>'+s[2]+'</p><h4>本阶段产物 / 观察点</h4><p>'+s[3]+'</p><div class="handoff"><b>交接规则：</b>'+s[4]+'</div><div class="cmd"><button data-copy>复制</button><span id="cmd">'+esc(s[5])+'</span></div><div class="controls"><button data-prev '+(step===0?"disabled":"") +'>← 上一阶段</button><button class="primary" data-next>'+(step===steps.length-1?"完成本路径":"下一阶段 →")+'</button></div></div></section><section class="panel right"><div class="ph">工作流说明</div><div class="pb"><h4>调用顺序</h4><p class="muted" style="font-size:11px">'+w.skills+'</p><h4>最终产物</h4><p class="muted" style="font-size:11px">'+w.out+'</p><div class="handoff"><b>人工决策 / 授权边界</b><br>'+w.gate+'</div><button class="action" data-mark>'+((done[wid]||[]).includes(branch)?"已标记完成 ✓":"标记此路径已掌握")+'</button><h4>不适用条件</h4><p class="muted" style="font-size:11px">'+w.notWhen+'</p></div></section></div>'}
W[0].notWhen="需求含糊、跨模块架构变化或高风险权限 / 数据迁移。";
W[1].notWhen="需求已经明确并批准实施，或仅需简单修改。";
W[2].notWhen="单文件小修改，或关键业务规则尚未确定。";
W[3].notWhen="方案已明确且只剩普通实施任务。";
W[4].notWhen="根因明确的简单拼写或配置错误。";
W[5].notWhen="真实需求是新增业务能力，或没有证据表明结构存在问题。";
function knowledge(){return '<div class="eyebrow">CORE TOPIC A</div><h1>新会话如何快速理解项目？</h1><p class="lead">把业务意图和代码事实分开管理，再让新会话将两者关联起来。</p><div class="article"><div><section class="box"><h2>两种不同的知识</h2><p>新会话需要回答：当初为什么这样设计？现在代码实际上怎么运行？它们不能由同一种资料完整回答。</p><div class="diagram"><div class="node"><b>Matt</b><small>业务意图 / 决策</small></div><div class="arrow">＋</div><div class="node"><b>CodeGraph</b><small>代码结构 / 调用关系</small></div><div class="chips"><span class="chip">Engineering Knowledge</span></div></div><h3>Matt 保存</h3><ul><li>GLOSSARY：领域术语和核心概念。</li><li>ADR：重要架构决策、理由和后果。</li><li>Feature Spec：一次变更的目标、规则、范围和验收条件。</li><li>Module Knowledge：模块目标、职责、业务规则和边界。</li></ul><h3>CodeGraph 发现</h3><ul><li>函数、类、方法、路由和组件等符号。</li><li>调用、导入、继承、引用和部分框架关系。</li><li>API 到 Service、Repository 的结构线索。</li><li>调用者和潜在影响范围。</li></ul></section><section class="box"><h2>新会话恢复流程</h2><ol><li>读取 AGENTS.md 和项目入口说明。</li><li>读取模块知识、GLOSSARY 和 ADR。</li><li>使用 CodeGraph 探索具体业务链路。</li><li>核对源码、Migration、OpenAPI 和测试。</li><li>区分文档意图、当前实现事实和未经验证的推断。</li></ol></section><section class="box"><h2>知识更新约定</h2><ul><li>对照批准的 Spec 与实际 Diff。</li><li>更新受影响模块的业务规则和职责边界。</li><li>必要时更新 GLOSSARY 与 ADR。</li><li>保留 API、Migration、测试和实现位置索引。</li><li>记录未解决差异，不得为了迎合代码而改写需求。</li></ul></section></div><div><section class="box"><h2>建议项目结构</h2><pre>AGENTS.md
GLOSSARY.md
docs/
  modules/
    workspace.md
  changes/
    feature-invite.md
  adr/
    001-runtime-binding.md
src/
migrations/
openapi/
tests/
.codegraph/</pre><p>CodeGraph 索引是本地生成资产，不是人工维护的业务文档。</p></section><section class="box"><h2>CodeGraph 边界</h2><p>优先使用 <code>codegraph_explore</code> 探索调用链。检查索引新鲜度；关键逻辑需核对源码。独立 SQL 文件、配置和数据库执行计划不能假设都被图谱完整理解。</p><a href="https://github.com/colbymchenry/codegraph" target="_blank">CodeGraph 官方仓库 ↗</a></section></div></div>'}
function verify(){return '<div class="eyebrow">CORE TOPIC B</div><h1>为什么测试通过，实际使用仍然有问题？</h1><p class="lead">自动化测试通过只证明已有断言通过，不代表需求完整，也不代表真实用户场景满足。</p><div class="article"><div><section class="box"><h2>典型失败故事</h2><p>Workspace 创建功能的单元和 API 测试通过，但真实操作时容器创建失败，页面仍显示成功；刷新后状态变化。</p><h3>常见根因</h3><ul><li>测试需求不完整，遗漏真实用户场景。</li><li>只测试单个函数或 API，没有完整流程。</li><li>Mock 隐藏数据库、容器或事件时序问题。</li><li>测试断言和实现来自同一套错误假设。</li><li>没有明确业务验收条件。</li></ul></section><section class="box"><h2>五层验证模型</h2><table class="table"><tr><th>层次</th><th>验证内容</th><th>证据</th></tr><tr><td>Unit</td><td>函数 / 组件</td><td>单元测试</td></tr><tr><td>Integration</td><td>数据库、API、服务协同</td><td>集成测试</td></tr><tr><td>E2E</td><td>完整用户操作</td><td>浏览器测试</td></tr><tr><td>Spec Review</td><td>需求、设计、实现一致</td><td>独立审查</td></tr><tr><td>Human Acceptance</td><td>真实使用符合预期</td><td>用户验收</td></tr></table></section><section class="box"><h2>测试必须从需求出发</h2><p>开发前把重要需求写成可观察的 Given / When / Then。测试断言来自已确认的验收条件，而不是根据写完的代码反向编造。</p><pre>Given 用户有创建 Workspace 的权限
And 用户选择 OpenCode Runtime
When 用户创建 Workspace
Then Workspace 创建成功
And Workspace 与 OpenCode 正确绑定
And 后续会话默认使用该 Runtime</pre></section></div><div><section class="box"><h2>完成状态不能只有 PASS</h2><p><span class="tag">Automated Verified</span><br>自动化测试按约定范围通过，有真实执行结果。</p><p><span class="tag">Spec Reviewed</span><br>需求、实现和测试映射经过独立检查。</p><p><span class="tag">Human Accepted</span><br>需要人工验收的功能已由用户确认。</p><p>人工验收未完成时，Agent 可以报告自动化验证通过，但不能声称最终业务验收通过。</p></section><section class="box"><h2>真实 Bug 处理</h2><p>使用 diagnosing-bugs 先建立能稳定复现原始症状的反馈循环，再提出可证伪假设。修复后重新执行原始场景。</p></section></div></div>'}
function skillPage(){return '<div class="eyebrow">REFERENCE</div><h1>Matt Pocock Skills 索引</h1><p class="lead">具体 Skill 是否存在、名称和调用权限，以安装的上游版本为准；不要假设索引中的 Skill 已经安装。</p><div class="grid">'+skills.map(s=>'<section class="card"><span class="tag">'+s[1]+'</span><h3><code>'+s[0]+'</code></h3><p>'+s[2]+'</p><p><b>适用：</b>'+s[3]+'</p></section>').join("")+'</div><section class="box" style="margin-top:12px"><h2>调用权限原则</h2><p>User-invoked 工作流入口由用户主动选择；Model-invoked 专业能力可在获准流程内按需调用。需求讨论完成或设计认可不代表编码授权。</p><a href="https://github.com/mattpocock/skills" target="_blank">Matt Pocock Skills 上游仓库 ↗</a></section>'}
function principles(){return '<div class="eyebrow">ENGINEERING PRINCIPLES</div><h1>工程原则与授权边界</h1><p class="lead">目标不是自动化程度最大化，而是在明确授权范围内减少重复劳动，同时保持决策可追溯、执行可验证。</p><div class="grid">'+[["人掌握决策权","人决定业务目标、重要规则、架构取舍、授权范围和最终验收。"],["Agent 在授权范围内执行","用户选择工作流入口；获准后 Agent 可以衔接流程内的专业 Skills。"],["证据决定完成状态","测试结果、Diff、运行结果和人工反馈是证据；Agent 自己说完成不是证据。"],["业务意图与代码事实分离","CodeGraph 描述当前代码结构；GLOSSARY、ADR、Spec 保存经确认的意图。"]].map(x=>'<section class="card"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></section>').join("")+'</div><section class="box" style="margin-top:12px"><h2>授权表</h2><table class="table"><tr><th>行为</th><th>授权要求</th></tr><tr><td>阅读项目、探索代码、提出建议</td><td>可自主执行（只读）</td></tr><tr><td>调用获准流程内专业 Skill</td><td>可执行，遵守上游规则</td></tr><tr><td>生成 Spec / Tickets</td><td>按授权执行，不等于编码授权</td></tr><tr><td>修改代码、数据库结构</td><td>需要实施授权</td></tr><tr><td>改变业务规则或重大架构</td><td>必须人工确认</td></tr><tr><td>生产操作、发布、合并主分支</td><td>必须明确授权</td></tr><tr><td>最终业务验收</td><td>由用户决定</td></tr></table></section>'}
function render(){nav();let el=$("#main");el.innerHTML=page==="home"?home():page==="workflow"?workflow():page==="knowledge"?knowledge():page==="verify"?verify():page==="skills"?skillPage():principles();$("#main").focus({preventScroll:true})}
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.w)go("workflow",b.dataset.w);if(b.dataset.page)go(b.dataset.page);if(b.dataset.branch){branch=b.dataset.branch;step=0;render()}if(b.dataset.step!==undefined){step=+b.dataset.step;render()}if(b.hasAttribute("data-prev")){step=Math.max(0,step-1);render()}if(b.hasAttribute("data-next")){if(step< W.find(w=>w.id===wid)[branch].length-1)step++;else{done[wid]=[...new Set([...(done[wid]||[]),branch])];localStorage.setItem("ael-progress",JSON.stringify(done))}render()}if(b.hasAttribute("data-mark")){done[wid]=[...new Set([...(done[wid]||[]),branch])];localStorage.setItem("ael-progress",JSON.stringify(done));render()}if(b.hasAttribute("data-copy")){navigator.clipboard?.writeText($("#cmd").textContent).then(()=>b.textContent="已复制").catch(()=>b.textContent="复制失败")}});function go(p,id){page=p;if(id)wid=id;branch="main";step=0;render();scrollTo(0,0)}
$("#theme").onclick=()=>{let t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;localStorage.setItem("ael-theme",t)};if(localStorage.getItem("ael-theme"))document.documentElement.dataset.theme=localStorage.getItem("ael-theme");
$("#search").oninput=e=>{let q=e.target.value.trim().toLowerCase();if(!q)return;let hit=W.find(w=>(w.title+w.summary+w.story+w.skills).toLowerCase().includes(q));if(hit)go("workflow",hit.id);else if(q.includes("知识")||q.includes("codegraph"))go("knowledge");else if(q.includes("测试")||q.includes("验收"))go("verify")};document.addEventListener("keydown",e=>{if(e.key==="/"&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){e.preventDefault();$("#search").focus()}if(e.key==="Escape"&&document.activeElement===$("#search")){$("#search").value="";$("#search").blur()}});render();
</script></body></html>
