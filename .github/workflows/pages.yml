name: Deploy AI Engineering Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate application scripts and course model
        run: |
          node --check app.js
          node --check curriculum.js
          node --check playbooks.js
          node -e "global.window=global;require('./curriculum.js');require('./playbooks.js');const p=LAB_PRACTICE;if(p.scenarios.length!==6||p.playbooks.length!==6)throw Error('Expected six scenarios and six playbooks');for(const w of p.playbooks){if(!w.routing||!w.preparation||w.steps.length<4||!w.artifactSamples.length||!w.decisions.length||!w.acceptance.length||!w.sources.length)throw Error('Incomplete playbook: '+w.id);for(const s of w.steps){if(!s.prompt||!s.agentBehavior||!s.artifact||!s.checklist.length||!s.handoff)throw Error('Incomplete step: '+w.id+'/'+s.id)}for(const id of w.knowledgeRefs)if(!LAB_CURRICULUM.lessons.some(l=>l.id===id))throw Error('Unknown knowledge lesson: '+id)}console.log('Validated '+p.scenarios.length+' scenarios, '+p.playbooks.length+' playbooks and '+p.playbooks.reduce((n,w)=>n+w.steps.length,0)+' steps')"
          test -s index.html
          node -e "const fs=require('fs');global.window=global;require('./curriculum.js');const c=LAB_CURRICULUM;if(c.groups.length!==3||c.lessons.length!==22)throw Error('Expected 3 groups and 22 lessons');for(let i=0;i<3;i++){const n=c.lessons.filter(x=>x.group===i).length;if(n<6)throw Error('Too few lessons in group '+i)}for(const l of c.lessons){if(l.main.length!==4||l.fault.steps.length!==4)throw Error('Expected four stages in '+l.id);if(!l.sections.length||!l.sources.length||!l.artifact)throw Error('Incomplete lesson '+l.id)}console.log('Validated '+c.groups.length+' domains, '+c.lessons.length+' lessons and '+c.lessons.length*8+' learning stages')"
          test -s styles.css
      - name: Browser-test automatic mechanism playback
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 > /tmp/ai-engineering-lab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/playback-smoke.cjs
          node tests/playbook-smoke.cjs
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
