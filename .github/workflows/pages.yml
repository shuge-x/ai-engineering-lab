name: Deploy AI Engineering Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate application scripts and course model
        run: |
          node --check app.js
          node --check data.js
          node -e "const fs=require('fs');global.window=global;require('./data.js');if(!LAB_DATA||LAB_DATA.workflows.length!==6)throw Error('Expected six workflows');for(const w of LAB_DATA.workflows){if(!w.main.length||!w.fault.length)throw Error('Incomplete workflow: '+w.id);for(const s of [...w.main,...w.fault])if(s.length<5)throw Error('Incomplete learning stage: '+w.id)}console.log('Validated '+LAB_DATA.workflows.length+' workflows')"
          test -s index.html
          test -s styles.css
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
