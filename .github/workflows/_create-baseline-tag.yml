name: Create v0.1.0 baseline tag

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_create-baseline-tag.yml

permissions:
  contents: write

jobs:
  create-tag:
    if: "github.event.head_commit.message == 'ci: run v0.1.0 baseline tag creation'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create annotated baseline tag
        env:
          TAG_TARGET: 7c1804501ccb7168d578e82ea05afc0954694fed
        run: |
          if git show-ref --verify --quiet refs/tags/v0.1.0; then
            echo "Tag v0.1.0 already exists"
            exit 1
          fi
          git tag -a v0.1.0 "$TAG_TARGET" -m "AI Engineering Lab v0.1.0 - first validated engineering learning baseline"
          git push origin refs/tags/v0.1.0
